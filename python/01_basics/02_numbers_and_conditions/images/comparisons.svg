<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><rect width="1000" height="410" rx="24" fill="#f5f8ff"/><text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172554">Операторы сравнения</text><text x="90" y="105" font-family="Arial" font-size="23" font-weight="bold" fill="#1e3a8a">Запись</text><text x="300" y="105" font-family="Arial" font-size="23" font-weight="bold" fill="#1e3a8a">Смысл</text><text x="650" y="105" font-family="Arial" font-size="23" font-weight="bold" fill="#1e3a8a">Пример</text><rect x="60" y="125" width="870" height="38" rx="8" fill="#fff"/><text x="100" y="151" font-family="Arial" font-size="19" font-weight="bold" fill="#7c3aed">==</text><text x="300" y="151" font-family="Arial" font-size="18" fill="#334155">равно</text><text x="650" y="151" font-family="Arial" font-size="18" fill="#334155">5 == 5 → True</text><rect x="60" y="168" width="870" height="38" rx="8" fill="#eaf1ff"/><text x="100" y="194" font-family="Arial" font-size="19" font-weight="bold" fill="#7c3aed">!=</text><text x="300" y="194" font-family="Arial" font-size="18" fill="#334155">не равно</text><text x="650" y="194" font-family="Arial" font-size="18" fill="#334155">5 != 3 → True</text><rect x="60" y="211" width="870" height="38" rx="8" fill="#fff"/><text x="100" y="237" font-family="Arial" font-size="19" font-weight="bold" fill="#7c3aed">></text><text x="300" y="237" font-family="Arial" font-size="18" fill="#334155">больше</text><text x="650" y="237" font-family="Arial" font-size="18" fill="#334155">7 > 4 → True</text><rect x="60" y="254" width="870" height="38" rx="8" fill="#eaf1ff"/><text x="100" y="280" font-family="Arial" font-size="19" font-weight="bold" fill="#7c3aed"><</text><text x="300" y="280" font-family="Arial" font-size="18" fill="#334155">меньше</text><text x="650" y="280" font-family="Arial" font-size="18" fill="#334155">2 < 6 → True</text><rect x="60" y="297" width="870" height="38" rx="8" fill="#fff"/><text x="100" y="323" font-family="Arial" font-size="19" font-weight="bold" fill="#7c3aed">>=</text><text x="300" y="323" font-family="Arial" font-size="18" fill="#334155">больше или равно</text><text x="650" y="323" font-family="Arial" font-size="18" fill="#334155">4 >= 4 → True</text><rect x="60" y="340" width="870" height="38" rx="8" fill="#eaf1ff"/><text x="100" y="366" font-family="Arial" font-size="19" font-weight="bold" fill="#7c3aed"><=</text><text x="300" y="366" font-family="Arial" font-size="18" fill="#334155">меньше или равно</text><text x="650" y="366" font-family="Arial" font-size="18" fill="#334155">3 <= 8 → True</text></svg>