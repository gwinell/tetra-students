<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460"><rect x="10" y="10" width="1080" height="440" rx="24" fill="white" stroke="#102f66" stroke-width="5"/><g font-family="DejaVu Sans, sans-serif" fill="#102f66"><text x="550" y="72" text-anchor="middle" font-size="38" font-weight="700">Одна задача — два цикла</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#12a6a0"/></marker></defs><text x="300" y="150" text-anchor="middle" font-size="30" font-weight="700">for</text><text x="800" y="150" text-anchor="middle" font-size="30" font-weight="700">while</text><rect x="140" y="180" width="310" height="58" rx="8" fill="#d4f4f1" stroke="#1673c8" stroke-width="3"/><text x="295.0" y="217" text-anchor="middle" font-size="20" font-weight="700">кот → пёс → ёж</text><rect x="640" y="180" width="310" height="58" rx="8" fill="#eef7ff" stroke="#1673c8" stroke-width="3"/><text x="795.0" y="217" text-anchor="middle" font-size="20" font-weight="700">кот → пёс → ёж</text><text x="300" y="290" text-anchor="middle" font-size="23">следующий элемент сам</text><text x="800" y="290" text-anchor="middle" font-size="23">счётчик контролируем мы</text><text x="550" y="420" text-anchor="middle" font-size="24">Одинаковый результат, разный контроль</text></g></svg>